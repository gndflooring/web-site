<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMS Option 2: Block-Based Page Composer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Outfit"', 'sans-serif'],
            display: ['"Space Grotesk"', 'sans-serif'],
          },
          colors: {
            amberBrand: {
              50: '#fffbeb', 100: '#fef3c7', 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706', 900: '#78350f'
            }
          }
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #d97706; border-radius: 4px; }
    .block-card {
      background: #1e1b18;
      border: 1px solid rgba(245, 158, 11, 0.15);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .block-card:hover {
      border-color: rgba(245, 158, 11, 0.4);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }
    .field-input {
      background: #12100e;
      border: 1px solid #2a241e;
      color: #fef3c7;
    }
    .field-input:focus {
      outline: none;
      border-color: #f59e0b;
      box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.2);
    }
  </style>
</head>
<body class="bg-[#12100e] text-amber-50 h-full flex flex-col font-sans">

  <!-- Top Navbar -->
  <header class="h-16 border-b border-amber-900/30 bg-[#1a1714] px-6 flex items-center justify-between shrink-0 sticky top-0 z-30">
    <div class="flex items-center gap-3">
      <div class="h-10 w-10 rounded-xl bg-gradient-to-br from-amber-500 to-amber-700 flex items-center justify-center font-display font-extrabold text-white text-lg shadow-lg shadow-amber-600/30">
        2
      </div>
      <div>
        <h1 class="font-display font-bold text-base text-amber-100 flex items-center gap-2">
          Block-Based Visual Composer
          <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30">Option 2</span>
        </h1>
        <p class="text-xs text-amber-200/60">Notion / Gutenberg style visual page structure management</p>
      </div>
    </div>

    <!-- Actions -->
    <div class="flex items-center gap-3">
      <button id="previewModalBtn" class="px-3.5 py-1.5 text-xs font-semibold rounded-lg bg-[#26201a] hover:bg-[#332b23] text-amber-200 border border-amber-900/40 flex items-center gap-2 transition">
        <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
        Full Live Preview
      </button>

      <button id="exportBtn" class="px-4 py-1.5 text-xs font-bold rounded-lg bg-amber-600 hover:bg-amber-500 text-white shadow-lg shadow-amber-600/20 flex items-center gap-2 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>
        Download site.json
      </button>
    </div>
  </header>

  <!-- Composer Body -->
  <div class="flex-1 flex overflow-hidden">
    
    <!-- Sidebar: Block Outline / Navigator -->
    <aside class="w-64 border-r border-amber-900/30 bg-[#161311] p-4 flex flex-col gap-4 overflow-y-auto shrink-0">
      <div class="text-xs font-display font-bold uppercase tracking-wider text-amber-400/80 px-2 flex items-center justify-between">
        <span>Page Structure</span>
        <span class="text-[10px] text-amber-200/50">10 Blocks</span>
      </div>

      <nav id="blockNav" class="space-y-1">
        <!-- Links dynamically generated -->
      </nav>

      <div class="mt-auto pt-4 border-t border-amber-900/30">
        <div class="p-3 rounded-xl bg-amber-950/40 border border-amber-900/40 text-xs text-amber-200/80 space-y-1">
          <div class="font-semibold text-amber-300">💡 Block Editing</div>
          <p class="text-[11px] leading-relaxed">Reorder blocks up/down to structure the website page visual flow.</p>
        </div>
      </div>
    </aside>

    <!-- Main Canvas Area -->
    <main class="flex-1 overflow-y-auto p-8 bg-[#0d0c0a] space-y-6 max-w-4xl mx-auto w-full" id="blocksContainer">
      <!-- Blocks rendered here -->
    </main>
  </div>

  <!-- Live Preview Modal -->
  <div id="previewModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-6">
    <div class="bg-[#181512] border border-amber-900/50 rounded-2xl w-full max-w-3xl max-h-[85vh] flex flex-col overflow-hidden shadow-2xl">
      <div class="p-4 border-b border-amber-900/40 flex justify-between items-center bg-[#1f1b17]">
        <h3 class="font-display font-bold text-amber-200 text-sm">Site Live Visual Render</h3>
        <button id="closePreview" class="text-amber-400 hover:text-white text-sm font-bold">✕ Close</button>
      </div>
      <div class="p-6 overflow-y-auto space-y-6" id="modalPreviewBody"></div>
    </div>
  </div>

  <script>
    let siteData = {
      "meta": { "title": "G&D Flooring — Premium Flooring & Renovations", "description": "Hardwood, luxury vinyl, tile & stone." },
      "hero": { "eyebrow": "Flooring Specialists", "headlineLead": "Floors that", "highlight": "elevate", "headlineRest": "every room.", "subcopy": "G&D Flooring brings craftsmanship and premium materials to hardwood and renovations." },
      "trust": ["Licensed & Insured", "Free On-Site Estimates", "Lifetime Warranty"],
      "services": { "eyebrow": "Our Services", "heading": "Full catalog of flooring craft", "items": [ { "title": "Hardwood", "desc": "Solid & engineered hardwood." }, { "title": "Luxury Vinyl", "desc": "Waterproof vinyl plank." } ] },
      "about": { "eyebrow": "Why Us", "headingLead": "Built on detail,", "headingRest": "finished with pride", "body": "We treat every home like our own." },
      "contact": { "eyebrow": "Get In Touch", "heading": "Plan your project", "phone": "(555) 123-4567", "email": "hello@gnd-flooring.com" }
    };

    const container = document.getElementById('blocksContainer');
    const nav = document.getElementById('blockNav');

    function renderBlocks() {
      container.innerHTML = '';
      nav.innerHTML = '';

      Object.keys(siteData).forEach((sectionKey, index) => {
        const block = siteData[sectionKey];

        // Nav item
        const navItem = document.createElement('a');
        navItem.href = `#block_${sectionKey}`;
        navItem.className = `flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium text-amber-200/70 hover:text-amber-200 hover:bg-amber-950/50 transition`;
        navItem.innerHTML = `
          <span class="flex items-center gap-2">
            <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>
            <span class="capitalize">${sectionKey}</span>
          </span>
          <span class="text-[10px] text-amber-400/50 font-mono">#${index + 1}</span>
        `;
        nav.appendChild(navItem);

        // Block Card
        const card = document.createElement('div');
        card.id = `block_${sectionKey}`;
        card.className = `block-card rounded-2xl p-6 relative group`;

        let cardContent = `
          <div class="flex items-center justify-between pb-4 border-b border-amber-900/30 mb-5">
            <div class="flex items-center gap-3">
              <span class="cursor-grab active:cursor-grabbing text-amber-500/40 hover:text-amber-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16"/></svg>
              </span>
              <div>
                <span class="text-[10px] font-mono uppercase tracking-wider text-amber-500/80 font-bold bg-amber-500/10 px-2 py-0.5 rounded border border-amber-500/20">
                  Block #${index + 1}
                </span>
                <h3 class="font-display font-bold text-lg text-amber-100 capitalize mt-0.5">${sectionKey} Section</h3>
              </div>
            </div>
            <div class="flex items-center gap-1.5">
              <button onclick="moveBlock(${index}, -1)" class="p-1.5 rounded-lg bg-[#26201a] hover:bg-amber-900/40 text-amber-300 text-xs" title="Move Block Up">↑</button>
              <button onclick="moveBlock(${index}, 1)" class="p-1.5 rounded-lg bg-[#26201a] hover:bg-amber-900/40 text-amber-300 text-xs" title="Move Block Down">↓</button>
            </div>
          </div>
        `;

        if (typeof block === 'object' && !Array.isArray(block)) {
          cardContent += `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">`;
          Object.keys(block).forEach(fieldKey => {
            const val = block[fieldKey];
            if (typeof val === 'string') {
              const isLong = fieldKey.includes('desc') || fieldKey.includes('subcopy') || fieldKey.includes('body');
              cardContent += `
                <div class="${isLong ? 'col-span-2' : ''}">
                  <label class="text-xs font-semibold text-amber-300/90 block mb-1 capitalize">${fieldKey.replace(/([A-Z])/g, ' $1')}</label>
                  ${isLong ? `
                    <textarea rows="2" onchange="updateVal('${sectionKey}.${fieldKey}', this.value)" class="field-input text-xs rounded-xl p-3 w-full">${escapeHtml(val)}</textarea>
                  ` : `
                    <input type="text" value="${escapeHtml(val)}" onchange="updateVal('${sectionKey}.${fieldKey}', this.value)" class="field-input text-xs rounded-xl px-3 py-2 w-full">
                  `}
                </div>
              `;
            }
          });
          cardContent += `</div>`;
        } else if (Array.isArray(block)) {
          cardContent += `
            <div class="space-y-2">
              <label class="text-xs font-semibold text-amber-300/90 block mb-1">List Items</label>
              ${block.map((item, i) => `
                <div class="flex gap-2">
                  <input type="text" value="${escapeHtml(item)}" onchange="updateVal('${sectionKey}.${i}', this.value)" class="field-input text-xs rounded-xl px-3 py-2 flex-1">
                  <button onclick="removeArrayItem('${sectionKey}', ${i})" class="text-xs text-rose-400 bg-rose-500/10 px-3 py-2 rounded-xl">Remove</button>
                </div>
              `).join('')}
              <button onclick="addArrayItem('${sectionKey}')" class="text-xs font-semibold text-amber-400 mt-2 block">+ Add Item</button>
            </div>
          `;
        }

        card.innerHTML = cardContent;
        container.appendChild(card);
      });
    }

    function escapeHtml(str) {
      return String(str || '').replace(/"/g, '&quot;');
    }

    function updateVal(path, val) {
      const keys = path.split('.');
      let cur = siteData;
      for (let i = 0; i < keys.length - 1; i++) cur = cur[keys[i]];
      cur[keys[keys.length - 1]] = val;
    }

    function moveBlock(index, dir) {
      const keys = Object.keys(siteData);
      const targetIndex = index + dir;
      if (targetIndex < 0 || targetIndex >= keys.length) return;

      const newSiteData = {};
      const keyList = Object.keys(siteData);
      [keyList[index], keyList[targetIndex]] = [keyList[targetIndex], keyList[index]];

      keyList.forEach(k => newSiteData[k] = siteData[k]);
      siteData = newSiteData;
      renderBlocks();
    }

    function addArrayItem(path) {
      siteData[path].push("New Item");
      renderBlocks();
    }

    function removeArrayItem(path, index) {
      siteData[path].splice(index, 1);
      renderBlocks();
    }

    // Modal
    document.getElementById('previewModalBtn').addEventListener('click', () => {
      document.getElementById('modalPreviewBody').innerHTML = `
        <div class="p-6 bg-[#12100e] rounded-xl border border-amber-900/30 text-amber-100 space-y-4">
          <span class="text-xs font-bold text-amber-500 uppercase tracking-widest">${siteData.hero.eyebrow}</span>
          <h2 class="text-2xl font-extrabold">${siteData.hero.headlineLead} ${siteData.hero.highlight} ${siteData.hero.headlineRest}</h2>
          <p class="text-xs text-amber-200/70">${siteData.hero.subcopy}</p>
        </div>
      `;
      document.getElementById('previewModal').classList.remove('hidden');
    });

    document.getElementById('closePreview').addEventListener('click', () => {
      document.getElementById('previewModal').classList.add('hidden');
    });

    document.getElementById('exportBtn').addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(siteData, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'site.json';
      a.click();
    });

    renderBlocks();
  </script>
</body>
</html>
