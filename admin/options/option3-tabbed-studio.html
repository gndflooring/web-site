<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMS Option 3: Tabbed Component Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Inter"', 'sans-serif'] },
          colors: {
            cyanBrand: { 400: '#22d3ee', 500: '#06b6d4', 600: '#0891b2', 900: '#164e63' },
            emeraldBrand: { 400: '#34d399', 500: '#10b981', 600: '#059669' }
          }
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: #06b6d4; border-radius: 4px; }
    .tab-btn.active {
      background: linear-gradient(90deg, rgba(6, 182, 212, 0.15) 0%, rgba(6, 182, 212, 0) 100%);
      border-left: 3px solid #06b6d4;
      color: #38bdf8;
    }
    .form-card {
      background: #0f172a;
      border: 1px solid #1e293b;
    }
    .studio-input {
      background: #090d16;
      border: 1px solid #334155;
      color: #f8fafc;
    }
    .studio-input:focus {
      outline: none;
      border-color: #06b6d4;
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.2);
    }
  </style>
</head>
<body class="bg-[#070a12] text-slate-100 h-full flex flex-col font-sans">

  <!-- Header -->
  <header class="h-16 border-b border-slate-800 bg-[#0c101d] px-6 flex items-center justify-between shrink-0 sticky top-0 z-20">
    <div class="flex items-center gap-3">
      <span class="h-9 w-9 rounded-lg bg-gradient-to-r from-cyan-500 to-emerald-500 flex items-center justify-center font-bold text-slate-950 text-base shadow-lg shadow-cyan-500/20">
        3
      </span>
      <div>
        <h1 class="font-bold text-sm text-white flex items-center gap-2">
          Tabbed Component Studio
          <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-cyan-500/20 text-cyan-300 border border-cyan-500/30">Option 3</span>
        </h1>
        <p class="text-xs text-slate-400">Structured category tabs with granular completion metrics</p>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <span class="text-xs text-slate-400 flex items-center gap-1.5 bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800">
        <span class="h-2 w-2 rounded-full bg-cyan-400"></span> Branch: <span class="text-slate-200 font-mono">content-draft</span>
      </span>
      <button id="exportJson" class="px-4 py-1.5 text-xs font-semibold rounded-lg bg-cyan-600 hover:bg-cyan-500 text-white transition shadow-md shadow-cyan-600/20">
        Export site.json
      </button>
    </div>
  </header>

  <!-- Workspace Studio -->
  <div class="flex-1 flex overflow-hidden">
    
    <!-- Navigation Tabs Sidebar -->
    <aside class="w-60 border-r border-slate-800/80 bg-[#0a0e19] py-4 flex flex-col shrink-0 overflow-y-auto">
      <div class="px-4 mb-3 text-[11px] font-bold uppercase tracking-wider text-slate-400">CMS Components</div>
      <nav id="tabsNav" class="space-y-0.5">
        <!-- Tabs generated dynamically -->
      </nav>
    </aside>

    <!-- Content Workspace -->
    <main class="flex-1 p-8 overflow-y-auto bg-[#070a12] space-y-6">
      <div class="max-w-3xl mx-auto">
        <div id="tabHeader" class="mb-6 pb-4 border-b border-slate-800 flex justify-between items-end">
          <div>
            <h2 id="activeTabTitle" class="text-2xl font-bold text-white capitalize">Hero Section</h2>
            <p id="activeTabDesc" class="text-xs text-slate-400 mt-1">Configure lead headlines, background imagery & call to actions.</p>
          </div>
          <span id="fieldCountBadge" class="text-xs px-2.5 py-1 rounded-full bg-slate-800 text-cyan-400 font-mono font-medium border border-slate-700">
            9 Fields
          </span>
        </div>

        <!-- Form Cards Container -->
        <div id="tabFormContent" class="space-y-6">
          <!-- Dynamic Form View -->
        </div>
      </div>
    </main>
  </div>

  <script>
    let siteData = {
      "meta": { "title": "G&D Flooring — Premium Flooring & Renovations", "description": "G&D Flooring is a premium flooring contractor specializing in hardwood, luxury vinyl, tile & stone.", "ogTitle": "G&D Flooring", "ogDescription": "Hardwood, luxury vinyl, tile & stone." },
      "hero": { "eyebrow": "Flooring & Renovation Specialists", "headlineLead": "Floors that", "highlight": "elevate", "headlineRest": "every room.", "subcopy": "G&D Flooring brings craftsmanship and premium materials.", "ctaPrimary": "Get a Free Quote", "ctaSecondary": "Explore Services", "image": "/images/hero.svg" },
      "trust": ["Licensed & Insured", "Free On-Site Estimates", "Lifetime Warranty", "Locally Owned"],
      "services": { "eyebrow": "Our Services", "heading": "A full catalog of flooring craft", "items": [ { "title": "Hardwood Flooring", "desc": "Solid & engineered hardwood installation." }, { "title": "Laminate & Vinyl", "desc": "Waterproof luxury vinyl plank." } ] },
      "about": { "eyebrow": "Why G&D", "headingLead": "Built on detail,", "headingRest": "finished with pride", "body": "We treat every home like our own." },
      "contact": { "eyebrow": "Get In Touch", "heading": "Let's plan your project", "phone": "(555) 123-4567", "email": "hello@gnd-flooring.com", "serviceArea": "Greater Austin Area" }
    };

    let activeKey = 'hero';
    const tabsNav = document.getElementById('tabsNav');
    const tabFormContent = document.getElementById('tabFormContent');

    function renderTabs() {
      tabsNav.innerHTML = '';
      Object.keys(siteData).forEach(key => {
        const btn = document.createElement('button');
        btn.className = `tab-btn w-full px-4 py-3 text-left text-xs font-semibold flex items-center justify-between text-slate-400 hover:text-slate-200 transition ${key === activeKey ? 'active' : ''}`;
        btn.onclick = () => { activeKey = key; renderTabs(); renderTabContent(); };
        btn.innerHTML = `
          <span class="capitalize">${key}</span>
          <span class="text-[10px] font-mono text-slate-500">${typeof siteData[key] === 'object' ? Object.keys(siteData[key]).length : siteData[key].length}</span>
        `;
        tabsNav.appendChild(btn);
      });
    }

    function renderTabContent() {
      document.getElementById('activeTabTitle').innerText = `${activeKey} Configuration`;
      const data = siteData[activeKey];
      tabFormContent.innerHTML = '';

      if (Array.isArray(data)) {
        const card = document.createElement('div');
        card.className = 'form-card p-6 rounded-2xl space-y-3';
        card.innerHTML = `
          <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider">String List Items</h3>
          ${data.map((item, i) => `
            <div class="flex gap-2">
              <input type="text" value="${escapeHtml(item)}" onchange="updateData('${activeKey}.${i}', this.value)" class="studio-input text-xs rounded-lg px-3 py-2 flex-1">
              <button onclick="removeArray('${activeKey}', ${i})" class="text-xs text-rose-400 bg-rose-500/10 px-3 py-2 rounded-lg">Delete</button>
            </div>
          `).join('')}
          <button onclick="addArray('${activeKey}')" class="text-xs text-cyan-400 font-semibold pt-2 block">+ Add Item</button>
        `;
        tabFormContent.appendChild(card);
      } else if (typeof data === 'object' && data !== null) {
        const card = document.createElement('div');
        card.className = 'form-card p-6 rounded-2xl space-y-4';

        let fieldsHtml = '';
        Object.keys(data).forEach(fieldKey => {
          const val = data[fieldKey];
          const isLong = fieldKey.includes('desc') || fieldKey.includes('subcopy') || fieldKey.includes('body');

          if (typeof val === 'string') {
            fieldsHtml += `
              <div>
                <div class="flex justify-between items-center mb-1">
                  <label class="text-xs font-semibold text-slate-300 capitalize">${fieldKey.replace(/([A-Z])/g, ' $1')}</label>
                  ${isLong ? `<span class="text-[10px] text-slate-500 font-mono">${val.length} chars</span>` : ''}
                </div>
                ${isLong ? `
                  <textarea rows="3" onchange="updateData('${activeKey}.${fieldKey}', this.value)" class="studio-input text-xs rounded-xl p-3 w-full">${escapeHtml(val)}</textarea>
                ` : `
                  <input type="text" value="${escapeHtml(val)}" onchange="updateData('${activeKey}.${fieldKey}', this.value)" class="studio-input text-xs rounded-xl px-3 py-2 w-full">
                `}
              </div>
            `;
          } else if (Array.isArray(val)) {
            fieldsHtml += `
              <div class="p-4 bg-[#090d16] rounded-xl border border-slate-800 space-y-3">
                <div class="flex justify-between items-center">
                  <label class="text-xs font-bold text-slate-300 uppercase tracking-wider">${fieldKey}</label>
                  <button onclick="addNestedItem('${activeKey}.${fieldKey}')" class="text-xs text-cyan-400 font-semibold">+ Add ${fieldKey}</button>
                </div>
                ${val.map((item, i) => `
                  <div class="p-3 bg-slate-900 rounded-lg border border-slate-800 space-y-2">
                    <div class="text-[10px] font-mono text-cyan-400">#${i + 1} ${item.title || 'Item'}</div>
                    ${typeof item === 'object' ? Object.keys(item).map(k => `
                      <input type="text" placeholder="${k}" value="${escapeHtml(item[k])}" onchange="updateData('${activeKey}.${fieldKey}.${i}.${k}', this.value)" class="studio-input text-xs rounded px-2.5 py-1 w-full">
                    `).join('') : ''}
                  </div>
                `).join('')}
              </div>
            `;
          }
        });
        card.innerHTML = fieldsHtml;
        tabFormContent.appendChild(card);
      }
    }

    function escapeHtml(str) { return String(str || '').replace(/"/g, '&quot;'); }

    function updateData(path, val) {
      const keys = path.split('.');
      let target = siteData;
      for (let i = 0; i < keys.length - 1; i++) target = target[keys[i]];
      target[keys[keys.length - 1]] = val;
    }

    function addArray(key) {
      siteData[key].push("New Item");
      renderTabContent();
    }

    function removeArray(key, i) {
      siteData[key].splice(i, 1);
      renderTabContent();
    }

    document.getElementById('exportJson').onclick = () => {
      const blob = new Blob([JSON.stringify(siteData, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'site.json';
      a.click();
    };

    renderTabs();
    renderTabContent();
  </script>
</body>
</html>
