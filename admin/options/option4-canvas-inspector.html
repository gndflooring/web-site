<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMS Option 4: Canvas Inspector (Figma Style)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"Fira Code"', 'monospace']
          },
          colors: {
            violetBrand: { 400: '#a78bfa', 500: '#8b5cf6', 600: '#7c3aed', 900: '#4c1d95' }
          }
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: #8b5cf6; border-radius: 4px; }
    .canvas-section {
      position: relative;
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .canvas-section:hover {
      outline: 2px solid rgba(139, 92, 246, 0.5);
      outline-offset: 4px;
    }
    .canvas-section.active-section {
      outline: 2px solid #8b5cf6;
      outline-offset: 4px;
      box-shadow: 0 0 25px rgba(139, 92, 246, 0.25);
    }
    .inspector-input {
      background: #111118;
      border: 1px solid #2b2b38;
      color: #f3f4f6;
    }
    .inspector-input:focus {
      outline: none;
      border-color: #8b5cf6;
      box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.25);
    }
  </style>
</head>
<body class="bg-[#0b0b0f] text-slate-100 h-full flex flex-col font-sans overflow-hidden">

  <!-- Top Bar -->
  <header class="h-16 border-b border-slate-800/80 bg-[#12121a] px-6 flex items-center justify-between shrink-0 z-30">
    <div class="flex items-center gap-3">
      <span class="h-9 w-9 rounded-xl bg-gradient-to-r from-violet-600 to-fuchsia-600 flex items-center justify-center font-bold text-white text-base shadow-lg shadow-violet-600/30">
        4
      </span>
      <div>
        <h1 class="font-bold text-sm text-white flex items-center gap-2">
          Floating Canvas Inspector
          <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-violet-500/20 text-violet-300 border border-violet-500/30">Option 4</span>
        </h1>
        <p class="text-xs text-slate-400">Click any component on the visual canvas to open its Inspector panel</p>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <span class="text-xs text-slate-400 font-mono bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800">
        Active Target: <span id="targetLabel" class="text-violet-400 font-bold">Hero Section</span>
      </span>
      <button id="exportJson" class="px-4 py-1.5 text-xs font-bold rounded-lg bg-violet-600 hover:bg-violet-500 text-white transition shadow-lg shadow-violet-600/20">
        Export site.json
      </button>
    </div>
  </header>

  <!-- Workspace -->
  <div class="flex-1 flex overflow-hidden relative">

    <!-- Canvas Preview (Center) -->
    <main class="flex-1 p-8 overflow-y-auto bg-[#08080c] flex justify-center">
      <div class="w-full max-w-3xl space-y-6" id="canvasView">
        <!-- Rendered Sections with click handlers -->
      </div>
    </main>

    <!-- Floating Property Inspector Drawer (Right) -->
    <aside class="w-96 border-l border-slate-800 bg-[#12121a] p-6 flex flex-col shrink-0 overflow-y-auto z-20">
      <div class="flex justify-between items-center pb-4 border-b border-slate-800 mb-5">
        <div>
          <span class="text-[10px] font-mono uppercase tracking-wider text-violet-400 font-bold">Inspector Panel</span>
          <h2 id="inspectorTitle" class="font-bold text-lg text-white capitalize">Hero Section</h2>
        </div>
        <span class="h-2 w-2 rounded-full bg-violet-400 animate-pulse"></span>
      </div>

      <div id="inspectorForm" class="space-y-4">
        <!-- Fields for active section -->
      </div>
    </aside>

  </div>

  <script>
    let siteData = {
      "meta": { "title": "G&D Flooring — Premium Flooring & Renovations", "description": "Hardwood, luxury vinyl, tile & stone." },
      "hero": { "eyebrow": "Flooring & Renovation Specialists", "headlineLead": "Floors that", "highlight": "elevate", "headlineRest": "every room.", "subcopy": "G&D Flooring brings craftsmanship and premium materials to hardwood and renovations.", "ctaPrimary": "Get a Free Quote", "ctaSecondary": "Explore Services" },
      "services": { "eyebrow": "Our Services", "heading": "A full catalog of flooring craft", "items": [ { "title": "Hardwood Flooring", "desc": "Solid & engineered hardwood." }, { "title": "Laminate & Vinyl", "desc": "Waterproof luxury vinyl plank." } ] },
      "contact": { "eyebrow": "Get In Touch", "heading": "Let's plan your project", "phone": "(555) 123-4567", "email": "hello@gnd-flooring.com" }
    };

    let activeSection = 'hero';

    function renderCanvas() {
      const canvas = document.getElementById('canvasView');
      canvas.innerHTML = '';

      Object.keys(siteData).forEach(secKey => {
        const sec = siteData[secKey];
        const secEl = document.createElement('div');
        secEl.className = `canvas-section p-6 rounded-2xl bg-[#13131c] border border-slate-800/80 shadow-lg ${secKey === activeSection ? 'active-section' : ''}`;
        secEl.onclick = () => { activeSection = secKey; renderCanvas(); renderInspector(); };

        let contentHtml = `
          <div class="flex justify-between items-center mb-3">
            <span class="text-[10px] font-mono text-violet-400 bg-violet-500/10 px-2 py-0.5 rounded border border-violet-500/20 font-bold capitalize">${secKey}</span>
            <span class="text-[10px] text-slate-500">Click to Inspect</span>
          </div>
        `;

        if (secKey === 'hero') {
          contentHtml += `
            <span class="text-xs font-semibold text-violet-400 uppercase tracking-widest">${sec.eyebrow}</span>
            <h3 class="text-xl font-bold text-white mt-1">${sec.headlineLead} <span class="text-violet-400">${sec.highlight}</span> ${sec.headlineRest}</h3>
            <p class="text-xs text-slate-400 mt-2">${sec.subcopy}</p>
            <div class="flex gap-2 mt-4">
              <button class="px-3 py-1.5 bg-violet-600 text-white rounded-lg text-xs font-bold">${sec.ctaPrimary}</button>
              <button class="px-3 py-1.5 bg-slate-800 text-slate-300 rounded-lg text-xs font-semibold border border-slate-700">${sec.ctaSecondary}</button>
            </div>
          `;
        } else if (secKey === 'services') {
          contentHtml += `
            <span class="text-xs font-semibold text-violet-400 uppercase tracking-widest">${sec.eyebrow}</span>
            <h3 class="text-lg font-bold text-white">${sec.heading}</h3>
            <div class="grid grid-cols-2 gap-3 mt-3">
              ${(sec.items || []).map(item => `
                <div class="p-3 bg-slate-900 rounded-xl border border-slate-800">
                  <h4 class="font-bold text-xs text-white">${item.title}</h4>
                  <p class="text-[11px] text-slate-400 mt-1">${item.desc}</p>
                </div>
              `).join('')}
            </div>
          `;
        } else {
          contentHtml += `
            <pre class="text-xs font-mono text-slate-300 bg-slate-950 p-3 rounded-lg overflow-x-auto">${JSON.stringify(sec, null, 2)}</pre>
          `;
        }

        secEl.innerHTML = contentHtml;
        canvas.appendChild(secEl);
      });
    }

    function renderInspector() {
      document.getElementById('inspectorTitle').innerText = activeSection;
      document.getElementById('targetLabel').innerText = activeSection.toUpperCase();

      const form = document.getElementById('inspectorForm');
      form.innerHTML = '';
      const data = siteData[activeSection];

      if (typeof data === 'object' && !Array.isArray(data)) {
        Object.keys(data).forEach(k => {
          const val = data[k];
          if (typeof val === 'string') {
            const fieldGroup = document.createElement('div');
            fieldGroup.innerHTML = `
              <label class="text-xs font-semibold text-slate-300 block mb-1 capitalize">${k.replace(/([A-Z])/g, ' $1')}</label>
              <input type="text" value="${escapeHtml(val)}" oninput="updateVal('${activeSection}.${k}', this.value)" class="inspector-input text-xs rounded-xl px-3 py-2 w-full">
            `;
            form.appendChild(fieldGroup);
          }
        });
      }
    }

    function escapeHtml(str) { return String(str || '').replace(/"/g, '&quot;'); }

    function updateVal(path, val) {
      const keys = path.split('.');
      let target = siteData;
      for (let i = 0; i < keys.length - 1; i++) target = target[keys[i]];
      target[keys[keys.length - 1]] = val;
      renderCanvas();
    }

    document.getElementById('exportJson').onclick = () => {
      const blob = new Blob([JSON.stringify(siteData, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'site.json';
      a.click();
    };

    renderCanvas();
    renderInspector();
  </script>
</body>
</html>
