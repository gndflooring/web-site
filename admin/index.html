<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#15212b" />
    <title>G&amp;D Flooring — Admin</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <!-- ===== Sign-in screen ===== -->
    <section id="signin" class="grid min-h-screen place-items-center px-6">
      <div class="card w-full max-w-md p-10 text-center">
        <div class="mx-auto grid h-14 w-14 place-items-center rounded-2xl bg-brand-600 font-display text-xl font-700 text-white">
          G&amp;D
        </div>
        <h1 class="mt-6 text-2xl font-600">Admin Console</h1>
        <p class="mt-2 text-sm text-muted">
          Lead tracking &amp; scheduling. Authorised Google accounts only.
        </p>
        <button id="signInBtn" class="btn-primary mt-8 w-full">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21.35 11.1H12v2.9h5.35c-.25 1.4-1.7 4.1-5.35 4.1-3.2 0-5.85-2.65-5.85-5.95S8.8 6.2 12 6.2c1.85 0 3.05.78 3.75 1.45l2.55-2.45C16.7 3.7 14.55 2.8 12 2.8 6.95 2.8 2.85 6.9 2.85 12S6.95 21.2 12 21.2c5.3 0 8.8-3.7 8.8-8.95 0-.6-.06-1.05-.15-1.5z"/></svg>
          Sign in with Google
        </button>
        <p id="signinMsg" class="mt-5 text-sm text-rose-600 empty:hidden"></p>
        <p id="cfgMsg" class="mt-5 text-xs text-amber-700 empty:hidden"></p>
      </div>
    </section>

    <!-- ===== App ===== -->
    <div id="app" hidden>
      <header class="sticky top-0 z-30 border-b border-ink/10 bg-cream/90 backdrop-blur">
        <div class="mx-auto flex max-w-7xl flex-wrap items-center gap-4 px-5 py-3">
          <div class="flex items-center gap-2.5">
            <span class="grid h-9 w-9 place-items-center rounded-lg bg-brand-600 font-display text-sm font-700 text-white">G&amp;D</span>
            <span class="font-display text-lg font-600">Admin</span>
          </div>
          <nav id="tabs" class="flex flex-wrap gap-1 text-sm font-500" aria-label="Views">
            <button data-view="dashboard" class="rounded-lg px-3 py-1.5">Dashboard</button>
            <button data-view="board" class="rounded-lg px-3 py-1.5">Board</button>
            <button data-view="leads" class="rounded-lg px-3 py-1.5">Leads</button>
            <button data-view="calendar" class="rounded-lg px-3 py-1.5">Calendar</button>
            <button data-view="todo" class="rounded-lg px-3 py-1.5">To-Do</button>
          </nav>
          <div class="ml-auto flex items-center gap-3 text-sm">
            <button id="refreshBtn" class="btn-ghost" title="Reload from the Sheet">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
              Refresh
            </button>
            <span id="userEmail" class="hidden text-muted sm:inline"></span>
            <button id="signOutBtn" class="btn-ghost">Sign out</button>
          </div>
        </div>
      </header>

      <main id="view" class="mx-auto max-w-7xl px-5 py-7"></main>

      <div id="toast" class="pointer-events-none fixed bottom-6 left-1/2 z-50 -translate-x-1/2 rounded-full bg-ink px-5 py-2.5 text-sm font-500 text-white opacity-0 transition-opacity duration-300"></div>
    </div>

    <script type="module" src="/src/admin/app.js"></script>
  </body>
</html>
