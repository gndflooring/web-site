<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#275f8c" />
    <title>Preview — G&amp;D Flooring</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="robots" content="noindex, nofollow" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!--
      A full rendered preview of the real site, drawn client-side with the very
      same src/content/render.js the production build uses — what you see here
      is what deploys. Pick the source: the editor's unsaved state, the
      content-draft branch, main, or the copy bundled with this build.
    -->
    <div class="pv-bar" id="pvBar">
      <span class="pv-tag">Preview</span>
      <div class="pv-sources" id="pvSources"></div>
      <div class="pv-sources pv-pages" id="pvPages"></div>
      <span class="pv-status" id="pvStatus"></span>
      <div class="pv-right">
        <button class="pv-btn" id="pvReload" type="button" title="Re-fetch and re-render">↻ Reload</button>
        <a class="pv-btn" href="/admin/">← Admin</a>
      </div>
    </div>

    <div id="page"></div>

    <script type="module" src="/src/preview.js"></script>
  </body>
</html>
