<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="G&amp;D">
  <title>G&amp;D</title>
  <defs>
    <linearGradient id="gd-tile" gradientUnits="userSpaceOnUse" x1="32" y1="0" x2="32" y2="64">
      <stop offset="0" stop-color="#3183bd"/>
      <stop offset="1" stop-color="#1d3f5b"/>
    </linearGradient>
    <!-- userSpaceOnUse: an objectBoundingBox gradient would not paint the
         D's stem, whose bounding box has zero width. -->
    <linearGradient id="gd-gold" gradientUnits="userSpaceOnUse" x1="14" y1="18" x2="52" y2="48">
      <stop offset="0" stop-color="#f0e3ca"/>
      <stop offset="0.42" stop-color="#c49a5e"/>
      <stop offset="1" stop-color="#966d38"/>
    </linearGradient>
  </defs>

  <!-- Tile: Guatemalan sky-blue, deepened so it reads on light and dark -->
  <rect x="0" y="0" width="64" height="64" rx="15" fill="url(#gd-tile)"/>

  <!-- The flag's two vertical bands, whispered rather than stated -->
  <rect x="7" y="7" width="2.5" height="50" rx="1.25" fill="#ffffff" opacity="0.20"/>
  <rect x="54.5" y="7" width="2.5" height="50" rx="1.25" fill="#ffffff" opacity="0.20"/>

  <!-- Gold hairline inset — the luxury cue -->
  <rect x="4.25" y="4.25" width="55.5" height="55.5" rx="11.5" fill="none" stroke="url(#gd-gold)" stroke-width="1" opacity="0.9"/>

  <!-- Ampersand behind the monogram, in a light teal so it reads as depth
       rather than as a third letter. -->
  <text x="32" y="32.5" text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'Times New Roman', 'Iowan Old Style', serif"
        font-size="34" font-style="italic" fill="#7fe0d2" opacity="0.32">&amp;</text>

  <!-- G and D share a cap height of 17 and near-equal widths (17 vs 15.2),
       spaced so their strokes clear each other and the ampersand shows
       through the gap. -->
  <g fill="none" stroke="url(#gd-gold)" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round">
    <g id="mark-g">
      <path d="M29.2 28.41 A8.5 8.5 0 1 0 29.2 35.59"/>
      <path d="M29.2 35.59 V32.1 H24.3"/>
    </g>
    <g id="mark-d">
      <path d="M38 23.5 V40.5"/>
      <path d="M38 23.5 H39.2 A12 8.5 0 0 1 39.2 40.5 H38"/>
    </g>
  </g>
</svg>
