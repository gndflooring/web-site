<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="G&amp;D">
  <title>G&amp;D</title>
  <defs>
    <linearGradient id="gd-tile" gradientUnits="userSpaceOnUse" x1="32" y1="0" x2="32" y2="64">
      <stop offset="0" stop-color="#3183bd"/>
      <stop offset="1" stop-color="#1d3f5b"/>
    </linearGradient>
    <!-- userSpaceOnUse: an objectBoundingBox gradient would not paint the
         D's stem, whose bounding box has zero width. -->
    <linearGradient id="gd-gold" gradientUnits="userSpaceOnUse" x1="10" y1="12" x2="56" y2="54">
      <stop offset="0" stop-color="#f0e3ca"/>
      <stop offset="0.42" stop-color="#c49a5e"/>
      <stop offset="1" stop-color="#966d38"/>
    </linearGradient>
  </defs>

  <!-- Tile: Guatemalan sky-blue, deepened so it reads on light and dark -->
  <rect x="0" y="0" width="64" height="64" rx="15" fill="url(#gd-tile)"/>

  <!-- Gold frame: the edge of the mark, not an inset hairline. -->
  <rect x="1.35" y="1.35" width="61.3" height="61.3" rx="13.7" fill="none" stroke="url(#gd-gold)" stroke-width="2.7"/>

  <!-- Ampersand behind the monogram — a hint of depth, not a third letter. -->
  <text x="32" y="33" text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'Times New Roman', 'Iowan Old Style', serif"
        font-size="50" font-style="italic" fill="#b6f2e8" opacity="0.15">&amp;</text>

  <!-- G and D, sized against each other rather than drawn to fit:
       the G is a 24.5-wide circle, the D 21 wide and a touch shorter, so the
       round letter overshoots the flat one the way a typeface would set them.
       Both sit on 7 units of margin, and the G's aperture is opened to ~12% of
       its height so it can never be mistaken for an O. -->
  <g fill="none" stroke="url(#gd-gold)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round">
    <g id="mark-g">
      <path d="M27.97 26.34 A10.4 10.4 0 1 0 28.89 35.90"/>
      <path d="M28.89 35.90 V33.2 H22.5"/>
    </g>
    <g id="mark-d">
      <path d="M37.9 22.15 V41.85"/>
      <path d="M37.9 22.15 H39.1 A16 9.85 0 0 1 39.1 41.85 H37.9"/>
    </g>
  </g>
</svg>
